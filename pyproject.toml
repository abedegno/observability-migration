[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "observability-migration-toolkit"
version = "0.59.0rc4"
description = "Read-only observability archive access: experimental journal adapter and lossless exports"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md", "docs/licenses/MIT.txt"]
dependencies = ["pyarrow==26.0.0", "zstandard==0.25.0"]

[project.optional-dependencies]
s3 = ["boto3==1.43.118", "botocore==1.43.118"]
federation = ["datafusion==55.0.0"]
test = ["pytest==9.1.1"]

[project.scripts]
obsmigrate = "obs_migrate.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
