name: Portable tests
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
        python: ['3.13', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python }}
          architecture: ${{ matrix.os == 'ubuntu-24.04' && 'x64' || 'arm64' }}
      - name: Install
        run: python -m pip install '.[test]'
      - name: Register audited external decoder
        run: |
          git -c core.autocrlf=false clone https://github.com/ponquersohn/splunk_ddss_extractor.git upstream/splunk_ddss_extractor
          git -C upstream/splunk_ddss_extractor checkout --detach d2885c63b36f115189f810eb0f43a888cc73c967
          obsmigrate setup-decoder --source "$PWD/upstream/splunk_ddss_extractor/src/splunk_ddss_extractor"
      - name: Test
        run: python -m pytest -q
