[matrix_events]
datatype = event
homePath = $SPLUNK_DB/matrix_events/db
coldPath = $SPLUNK_DB/matrix_events/colddb
thawedPath = $SPLUNK_DB/matrix_events/thaweddb
maxTotalDataSizeMB = 256
frozenTimePeriodInSecs = 2000000000
journalCompression = lz4
quarantinePastSecs = 2000000000
quarantineFutureSecs = 2000000000
[metrics_default]
datatype = metric
homePath = $SPLUNK_DB/metrics_default/db
coldPath = $SPLUNK_DB/metrics_default/colddb
thawedPath = $SPLUNK_DB/metrics_default/thaweddb
maxTotalDataSizeMB = 256
frozenTimePeriodInSecs = 2000000000
journalCompression = lz4
quarantinePastSecs = 2000000000
quarantineFutureSecs = 2000000000
